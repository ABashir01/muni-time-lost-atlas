services:
  db:
    image: postgis/postgis:16-3.4
    container_name: muni-lost-time-atlas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: muni_lost_time_atlas
      POSTGRES_USER: muni
      POSTGRES_PASSWORD: muni_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muni -d muni_lost_time_atlas"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
