[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "muni-lost-time-atlas"
version = "0.1.0"
description = "Bootstrap tooling for the Muni Lost Time Atlas API and data platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "dbt-postgres==1.10.0",
  "fastapi>=0.115,<1.0",
  "mashumaro>=3.17,<3.18",
  "psycopg[binary]>=3.2,<3.3",
  "tzdata>=2025.2",
]

[tool.setuptools.packages.find]
where = ["api/src", "pipeline/src"]
include = ["muni_lta_api*", "muni_lta_pipeline*"]
