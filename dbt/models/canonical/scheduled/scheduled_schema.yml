version: 2

models:
  - name: scheduled_routes
    columns:
      - name: route_id
        tests:
          - not_null
          - unique

  - name: scheduled_stops
    columns:
      - name: stop_id
        tests:
          - not_null
          - unique

  - name: scheduled_trips
    columns:
      - name: trip_id
        tests:
          - not_null
          - unique
      - name: route_id
        tests:
          - not_null
          - relationships:
              to: ref('scheduled_routes')
              field: route_id
      - name: service_id
        tests:
          - not_null

  - name: service_dates
    tests:
      - unique_column_combination:
          columns:
            - service_id
            - service_date
    columns:
      - name: service_id
        tests:
          - not_null
      - name: service_date
        tests:
          - not_null

  - name: scheduled_stop_events
    tests:
      - unique_column_combination:
          columns:
            - trip_id
            - service_date
            - stop_sequence
    columns:
      - name: trip_id
        tests:
          - not_null
          - relationships:
              to: ref('scheduled_trips')
              field: trip_id
      - name: route_id
        tests:
          - not_null
          - relationships:
              to: ref('scheduled_routes')
              field: route_id
      - name: service_id
        tests:
          - not_null
      - name: service_date
        tests:
          - not_null
      - name: stop_id
        tests:
          - not_null
          - relationships:
              to: ref('scheduled_stops')
              field: stop_id
      - name: stop_sequence
        tests:
          - not_null
