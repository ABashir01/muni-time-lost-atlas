<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <style>
    .bg { fill: #ffffff; }
    .ink { fill: #050505; }
    .muted { fill: #5c5c5c; }
    .rule { stroke: #101010; stroke-width: 2; }
    .thin { stroke: #101010; stroke-width: 1.2; }
    .red { fill: #d81420; }
    .yellow { fill: #fcc000; }
    .blue { fill: #0868d0; }
    .orange { fill: #e85c10; }
    .eyebrow { font: 700 18px 'Helvetica Neue', Arial, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
    .nav { font: 700 17px 'Helvetica Neue', Arial, sans-serif; letter-spacing: 0.04em; text-transform: uppercase; }
    .brand { font: 700 46px 'Oswald', 'Arial Narrow', sans-serif; text-transform: uppercase; }
    .headline { font: 700 62px 'Oswald', 'Arial Narrow', sans-serif; line-height: 0.94; text-transform: uppercase; }
    .body { font: 400 20px 'Helvetica Neue', Arial, sans-serif; }
    .small { font: 400 16px 'Helvetica Neue', Arial, sans-serif; }
    .subhead { font: 700 28px 'Oswald', 'Arial Narrow', sans-serif; text-transform: uppercase; }
  </style>
  <rect class="bg" x="0" y="0" width="1440" height="900"/>
  <rect class="red" x="24" y="18" width="84" height="40"/>
  <text x="44" y="46" class="eyebrow" fill="#fff">Muni</text>
  <text x="126" y="50" class="brand ink">Muni Lost Time Atlas</text>
  <text x="933" y="47" class="nav ink">Explore the Map</text>
  <text x="1108" y="47" class="nav ink">Rankings</text>
  <text x="1216" y="47" class="nav ink">Compare</text>
  <text x="1316" y="47" class="nav ink">Data &amp; Methods</text>
  <line class="rule" x1="24" y1="70" x2="1416" y2="70"/>

  <text x="24" y="112" class="eyebrow ink">Compare</text>
  <text x="24" y="178" class="headline ink">Shared System,</text>
  <text x="24" y="236" class="headline red">Lighter Weight.</text>
  <text x="24" y="278" class="body ink">Compare should inherit the same masthead, rules, palette, and type hierarchy without becoming a primary redesign surface in B8.</text>

  <rect x="24" y="320" width="1392" height="84" fill="#fff" stroke="#101010" stroke-width="2"/>
  <text x="48" y="352" class="eyebrow ink">Compare routes or corridors</text>
  <rect x="650" y="338" width="180" height="42" fill="#fff" stroke="#101010" stroke-width="2"/>
  <rect x="852" y="338" width="180" height="42" fill="#fff" stroke="#101010" stroke-width="2"/>
  <circle cx="1055" cy="359" r="20" fill="#050505"/>
  <text x="1046" y="366" class="eyebrow" fill="#fff" style="letter-spacing:0">VS</text>
  <rect x="1086" y="338" width="124" height="42" class="yellow" stroke="#101010" stroke-width="2"/>
  <text x="1114" y="366" class="eyebrow ink">Compare</text>
  <g transform="translate(1242 338)">
    <line x1="0" y1="8" x2="148" y2="8" stroke="#0868d0" stroke-width="3"/>
    <line x1="0" y1="22" x2="148" y2="22" stroke="#d81420" stroke-width="3"/>
    <line x1="0" y1="36" x2="148" y2="36" stroke="#fcc000" stroke-width="3"/>
    <circle cx="76" cy="8" r="7" fill="#fff" stroke="#0868d0" stroke-width="2"/>
    <circle cx="76" cy="22" r="7" fill="#fff" stroke="#d81420" stroke-width="2"/>
    <circle cx="76" cy="36" r="7" fill="#fff" stroke="#fcc000" stroke-width="2"/>
  </g>
  <text x="24" y="438" class="small muted">Primary compare fixes in B8: align the masthead and palette, fix the yellow, and stop the motif lines from leaking into the button.</text>

  <rect x="24" y="470" width="678" height="370" fill="#fff" stroke="#101010" stroke-width="2"/>
  <rect x="714" y="470" width="702" height="370" fill="#fff" stroke="#101010" stroke-width="2"/>
  <text x="48" y="512" class="subhead ink">14 Mission</text>
  <text x="738" y="512" class="subhead ink">49 Van Ness / Mission</text>
  <text x="48" y="564" class="body ink">Cards should inherit the same rule language and condensed headline rhythm, but compare stays secondary to rankings, map, and route detail.</text>
  <text x="738" y="564" class="body ink">No major hero reinvention required. It just needs to stop feeling like a different product.</text>
</svg>
